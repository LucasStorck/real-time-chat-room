[workspace]
resolver = "3"
members = ["shared", "server", "client"]
# `cargo build`/`cargo test` na raiz ignoram o client (ele é compilado para WASM pelo Trunk).
default-members = ["shared", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
